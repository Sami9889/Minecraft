name: Minecraft Server - Remote Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - update
          - restart
  schedule:
    - cron: '0 4 * * *'

jobs:
  minecraft-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download server files
        run: |
          mkdir -p server plugins configs world logs server/plugins
          curl -L -o server/paper.jar "https://fill-data.papermc.io/v1/objects/bd3a58cf96874e5ea6643f5f6fe9b4f5bf9e34b795fa078c2f0ee8b98b2f907e/paper-26.2-112.jar"
          curl -L -o server/plugins/Geyser-Spigot.jar "https://github.com/GeyserMC/Geyser/releases/download/2.11.1/Geyser-Spigot.jar"
          curl -L -o server/plugins/ViaVersion.jar "https://hangarcdn.papermc.io/plugins/ViaVersion/ViaVersion/versions/5.11.0/PAPER/ViaVersion-5.11.0.jar"
      - name: Configure server
        run: |
          echo "eula=true" > server/eula.txt
          echo "server-port=25565" > server/server.properties
          echo "enable-rcon=false" >> server/server.properties
          echo "rcon.password=" >> server/server.properties
          echo "max-players=20" >> server/server.properties
          echo "online-mode=true" >> server/server.properties
          echo "enable-status=true" >> server/server.properties
          echo "motd=Paper Server - GitHub Actions" >> server/server.properties
          echo "difficulty=normal" >> server/server.properties
          echo "gamemode=survival" >> server/server.properties
          echo "spawn-protection=16" >> server/server.properties
          echo "view-distance=10" >> server/server.properties
          echo "simulation-distance=8" >> server/server.properties
          echo "white-list=false" >> server/server.properties
          echo "enforce-secure-profile=true" >> server/server.properties
          mkdir -p server/plugins/Geyser-Spigot
          echo "bedrock:" > server/plugins/Geyser-Spigot/config.yml
          echo "  address: 0.0.0.0" >> server/plugins/Geyser-Spigot/config.yml
          echo "  port: 19132" >> server/plugins/Geyser-Spigot/config.yml
          echo "  clone-remote-port: false" >> server/plugins/Geyser-Spigot/config.yml
          echo "remote:" >> server/plugins/Geyser-Spigot/config.yml
          echo "  address: ${{ secrets.IP }}" >> server/plugins/Geyser-Spigot/config.yml
          echo "  port: 25565" >> server/plugins/Geyser-Spigot/config.yml
          echo "  auth-type: online" >> server/plugins/Geyser-Spigot/config.yml
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Test SSH connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "echo Connected to VPS"
      - name: Upload server files
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo mkdir -p /opt/minecraft-server"
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            server/ ${{ secrets.SSH_USER }}@${{ secrets.IP }}:/opt/minecraft-server/server/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            minecraft-server/scripts/ ${{ secrets.SSH_USER }}@${{ secrets.IP }}:/opt/minecraft-server/scripts/
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" \
            minecraft-server/configs/ ${{ secrets.SSH_USER }}@${{ secrets.IP }}:/opt/minecraft-server/configs/
      - name: Setup VPS dependencies
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo bash /opt/minecraft-server/scripts/setup-backend.sh"
      - name: Fix permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo chown -R minecraft:minecraft /opt/minecraft-server"
      - name: Start server
        if: github.event.inputs.action == 'deploy' || github.event_name == 'schedule'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo systemctl daemon-reload && sudo systemctl enable --now minecraft-server"
      - name: Restart server
        if: github.event.inputs.action == 'restart'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo systemctl restart minecraft-server"
      - name: Update server
        if: github.event.inputs.action == 'update'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.IP }} "sudo systemctl restart minecraft-server"
